name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug — ServerForge is still in alpha, so this really helps.

  - type: input
    id: version
    attributes:
      label: ServerForge version
      description: Shown at the bottom of the Sidebar (e.g. v0.0.1-alpha.13)
    validations:
      required: true

  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Palworld
        - Valheim
        - Astroneer
        - Not game-specific
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Screenshots welcome.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server console output or app logs, if relevant. Redact IPs/tokens if any.
      render: shell
    validations:
      required: false
