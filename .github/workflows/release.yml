name: Release

# release-please tient à jour une PR de release (bump de package.json +
# CHANGELOG.md) à partir des titres de PR conventional commits mergés sur
# main. Merger cette PR crée la release GitHub en draft + le tag, puis le job
# build-windows y attache les .exe/latest.yml et la publie.
#
# Tout est dans un seul workflow : un tag créé avec GITHUB_TOKEN ne déclenche
# aucun autre workflow (limitation GitHub), un release.yml "on: push: tags"
# séparé ne partirait donc jamais.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-windows:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Le push déclencheur est sur main (pas sur un tag) : sans
      # `--publish always`, electron-builder ne publierait pas. Il réutilise
      # la release draft créée par release-please (même tag v<version>).
      - name: Build & upload to draft release
        run: yarn build --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publiée seulement une fois tous les assets en ligne : l'auto-updater
      # ne voit jamais une release sans latest.yml.
      - name: Publish release
        shell: bash
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: dist/*.exe
