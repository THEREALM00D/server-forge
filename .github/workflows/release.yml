name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack (Yarn)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # electron-builder.yml déclare `publish: provider: github` — yarn build
      # publie donc déjà directement sur la Release GitHub correspondant au
      # tag (détection auto CI + tag), ce qui rendait l'étape
      # softprops/action-gh-release plus bas totalement redondante (et jamais
      # atteinte de toute façon, puisque cette étape échouait avant).
      - name: Build & publish
        run: yarn build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe
