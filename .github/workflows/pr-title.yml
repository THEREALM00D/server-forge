name: PR title

# Les PR sont squash-mergées avec leur titre comme message de commit :
# release-please calcule la version et le CHANGELOG à partir de ces titres.
# feat → mineur, fix → patch (tant qu'on est en 0.x, feat! → mineur aussi).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
