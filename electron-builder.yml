appId: com.serverforge.app
productName: ServerForge
directories:
  buildResources: resources
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
win:
  executableName: server-forge
  icon: resources/icon.ico
  requestedExecutionLevel: requireAdministrator
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${name}-${version}-portable.${ext}
publish:
  provider: github
  # release-please crée la release en draft (release-please-config.json) :
  # electron-builder y attache les assets (il réutilise toujours un draft
  # existant pour le tag), puis release.yml la publie. "draft" ici garantit
  # qu'aucun build ne publie jamais une release visible par lui-même.
  releaseType: draft
