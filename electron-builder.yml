appId: com.serverforge.app
productName: ServerForge
directories:
  buildResources: resources
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
win:
  executableName: server-forge
  icon: resources/icon.ico
  requestedExecutionLevel: requireAdministrator
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${name}-${version}-portable.${ext}
publish:
  provider: github
  releaseType: release
  # Sans ça, electron-builder publie "latest.yml" — mais electron-updater,
  # avec allowPrerelease + un tag semver "X.Y.Z-alpha.N", cherche le canal
  # dérivé du tag ("alpha.yml"), jamais "latest.yml". Les deux doivent
  # correspondre pour que la détection de mise à jour fonctionne.
  channel: alpha
